<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>한국어 멘토링 학습지 생성기</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f5f7;color:#222;font-family:Arial,"Noto Sans KR",sans-serif}
.wrap{max-width:1060px;margin:20px auto;padding:16px}
.panel{background:#fff;border-radius:18px;padding:24px;box-shadow:0 4px 24px #0001}
h1{margin:0 0 8px;font-size:28px}
h2{margin:0 0 12px}
.desc,.muted{color:#666}
label{display:block;font-weight:700;margin:14px 0 7px}
input,textarea,select{width:100%;padding:12px;border:1px solid #d4d9de;border-radius:9px;font-size:15px;background:#fff}
textarea{min-height:100px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
button{border:0;border-radius:10px;padding:12px 17px;font-size:15px;font-weight:700;cursor:pointer;background:#222;color:#fff;margin-top:16px}
button.secondary{background:#e9edf1;color:#222;margin-left:7px}
button.small{font-size:13px;padding:8px 10px;margin:0;background:#edf1f4;color:#222}
.help{background:#f5f7f8;border-radius:10px;padding:10px 12px;color:#666;font-size:13px;line-height:1.5;margin-top:8px}
#editor{margin-top:20px}
.word-edit{background:#fafbfc;border:1px solid #dfe3e7;border-radius:13px;padding:14px;margin:12px 0}
.word-head{display:grid;grid-template-columns:120px 1fr 180px;gap:10px;align-items:center}
.kword{font-size:18px;font-weight:800}
.imgbox{margin-top:10px;display:flex;align-items:center;gap:12px}
.preview-img{width:70px;height:70px;object-fit:cover;border-radius:9px;border:1px solid #ddd;display:none}
.status{margin-top:10px;color:#666}
.preview-wrap{margin-top:24px}
.preview-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
#preview{background:#dfe3e7;padding:16px;border-radius:14px}
.print-page{width:210mm;min-height:297mm;background:#fff;margin:0 auto 18px;padding:11mm;box-shadow:0 2px 10px #0002;page-break-after:always}
.meta-title{text-align:center;font-size:34px;font-weight:800;margin-bottom:9px}
.meta-line{text-align:center;font-size:18px;color:#555;margin-bottom:18px}
.print-page h2{text-align:center;font-size:21px;margin:0 0 12px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:5mm}
.cards.one-col{grid-template-columns:1fr}
.card{border:1px solid #777;display:flex;flex-direction:column;background:#fff}
.card-top{display:flex;align-items:center;justify-content:center;background:#f4f7f9;padding:4mm;flex:0 0 auto}
.card-top img{width:22mm;height:22mm;object-fit:cover;border-radius:5px;margin-right:5mm}
.meaning{font-size:18px;font-weight:800;text-align:center;word-break:keep-all}
.writing{display:flex;flex-direction:column;flex:none}
.write-row{display:grid;flex:none;border-top:1px solid #aaa}
.write-row .cell{display:flex;align-items:center;justify-content:center;border-right:1px solid #aaa}
.write-row .cell:last-child{border-right:0}
.black{color:#222}
.gray{color:#b9bec3}

.numgrid{display:grid;grid-template-columns:1fr 1fr;gap:5mm}
.ncard{border:1px solid #777;padding:7px;display:flex;flex-direction:column}
.number-only{text-align:center;font-size:27px;font-weight:800;margin:2px 0 8px}
.ngrid{display:flex;flex-direction:column;flex:1}
.nrow{display:grid;flex:none;border-top:1px solid #aaa}
.nrow.one-col{grid-template-columns:1fr}
.nrow.two-col{grid-template-columns:1fr 1fr}
.nrow span{display:flex;align-items:center;justify-content:center;border-right:1px solid #aaa}
.nrow span:last-child{border-right:0}

@media(max-width:760px){
 .row,.word-head,.cards,.numgrid{grid-template-columns:1fr}
 .wrap{padding:8px}
}
@media print{
 body{background:#fff}
 .panel,.preview-head{display:none!important}
 #preview{background:#fff;padding:0}
 .print-page{margin:0;box-shadow:none}
}

.packed-rows{display:flex;flex-direction:column;gap:5mm;width:100%}
.packed-row{display:grid;gap:5mm;width:100%}
.packed-row.two{grid-template-columns:1fr 1fr}
.packed-row.one{grid-template-columns:1fr}
.packed-row .card{width:100%;min-width:0}
.packed-row .write-row{width:100%;max-width:100%}
@media(max-width:760px){
 .packed-row.two{grid-template-columns:1fr 1fr !important}
 .packed-row.one{grid-template-columns:1fr !important}
}

/* Number worksheet stability */
.numgrid.stable-numgrid{
  display:grid !important;
  grid-template-columns:1fr 1fr !important;
  gap:5mm !important;
  width:100% !important;
  align-items:start !important;
}
.stable-numgrid .ncard{
  width:100% !important;
  min-width:0 !important;
  aspect-ratio: 1.55 / 1;
}
.stable-numgrid .ngrid{
  min-height:0 !important;
}
.stable-numgrid .nrow{
  min-height:0 !important;
}
@media(max-width:760px){
  .numgrid.stable-numgrid{
    grid-template-columns:1fr 1fr !important;
  }
}

@media print{
  html,body{margin:0!important;padding:0!important;background:#fff!important}
  .panel,.preview-head{display:none!important}
  .preview-wrap{margin:0!important;padding:0!important}
  #preview{background:#fff!important;padding:0!important;margin:0!important}
  .print-page{
    box-sizing:border-box!important;
    width:210mm!important;
    height:292mm!important;
    min-height:292mm!important;
    max-height:292mm!important;
    margin:0!important;
    padding:8mm!important;
    overflow:hidden!important;
    box-shadow:none!important;
    page-break-after:auto!important;
    break-after:auto!important;
  }
  .print-page + .print-page{
    page-break-before:always!important;
    break-before:page!important;
  }
  .print-page:last-child{
    page-break-after:auto!important;
    break-after:auto!important;
  }
  @page{size:A4 portrait;margin:0}
}
</style>
<style>
@media print{ }</style><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/4.0.0/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

<style>
/* FINAL NUMBER CARD LAYOUT */
.numgrid.stable-numgrid{
  display:grid!important;
  grid-template-columns:repeat(2,minmax(0,1fr))!important;
  gap:5mm!important;
  width:100%!important;
  align-items:start!important;
}
.numgrid.stable-numgrid .ncard{
  width:100%!important;
  min-width:0!important;
  height:auto!important;
  min-height:0!important;
  aspect-ratio:auto!important;
  box-sizing:border-box!important;
  overflow:hidden!important;
}
.numgrid.stable-numgrid .number-only{
  height:11mm!important;
  margin:0!important;
  display:flex!important;
  align-items:center!important;
  justify-content:center!important;
  flex:none!important;
  box-sizing:border-box!important;
}
.numgrid.stable-numgrid .ngrid{
  display:flex!important;
  flex-direction:column!important;
  width:100%!important;
  flex:none!important;
}
.numgrid.stable-numgrid .nrow{
  display:grid!important;
  width:100%!important;
  height:10mm!important;
  min-height:10mm!important;
  max-height:10mm!important;
  flex:none!important;
  box-sizing:border-box!important;
}
.numgrid.stable-numgrid .nrow.one-col{grid-template-columns:1fr!important}
.numgrid.stable-numgrid .nrow.two-col{grid-template-columns:1fr 1fr!important}
.numgrid.stable-numgrid .nrow span{
  min-width:0!important;
  width:100%!important;
  height:100%!important;
  box-sizing:border-box!important;
  display:flex!important;
  align-items:center!important;
  justify-content:center!important;
}
@media(max-width:760px){
  .numgrid.stable-numgrid{
    grid-template-columns:repeat(2,minmax(0,1fr))!important;
  }
}
</style>
</head>
<body>
<div class="wrap">
<section class="panel">
<h1>🇰🇷 한국어 멘토링 학습지 생성기</h1>
<p class="desc">단어와 숫자 학습지를 만들고, 아래에서 바로 미리보기할 수 있어요.</p>

<label>① 한국어 단어</label>
<textarea id="words" placeholder="예: 머리, 눈, 코, 귀, 입"></textarea>
<div class="help">단어쓰기에서만 사용합니다. 쉼표 또는 줄바꿈으로 입력하세요.</div>

<div class="row">
<div>
<label>② 학습지 종류</label>
<select id="type">
<option value="word">단어쓰기</option>
<option value="number">숫자쓰기</option>
</select>
</div>
<div id="sortWrap">
<label>③ 단어 분류</label>
<select id="sortMode">
<option value="auto">AI 자동 분류</option>
<option value="custom">내가 정한 분류</option>
<option value="none">분류하지 않기</option>
</select>
</div>
</div>

<button type="button" id="aiClassifyBtn" class="secondary" style="margin-top:8px">🤖 AI로 자동 분류하기</button>
<div id="aiClassifyStatus" class="help" style="margin-top:6px"></div>
<div id="customBlock" style="display:none">
<label>내가 정한 분류 입력</label>
<textarea id="customGroups" placeholder="[몸]
머리, 이마, 눈, 코, 귀, 입

[인사]
안녕하세요, 잘가, 반갑습니다

[눈코입 가사]
미안해, 초라한, 빨간색, 예쁜, 죽이다"></textarea>
<div class="help">분류명은 <b>[분류명]</b>, 아래 줄에 단어를 쉼표로 적으세요. 여러 분류를 한 번에 입력할 수 있어요.</div>
</div>

<div id="numberBlock" style="display:none">
<div class="row">
<div>
<label>③ 숫자 학습 방식</label>
<select id="numberType">
<option value="both">한자어 + 고유어</option>
<option value="sino">한자어만</option>
<option value="native">고유어만</option>
</select>
</div>
<div>
<label>④ 숫자 입력 방법</label>
<select id="numberMode">
<option value="range">범위로 입력</option>
<option value="custom">직접 입력</option>
</select>
</div>
</div>
<div class="row" id="rangeBlock">
<div><label>시작 숫자</label><input id="numStart" type="number" min="1" max="100" value="1"></div>
<div><label>끝 숫자</label><input id="numEnd" type="number" min="1" max="100" value="100"></div>
</div>
<div id="customNumbersBlock" style="display:none">
<label>원하는 숫자 입력</label>
<input id="customNumbers" placeholder="예: 1, 3, 7, 21, 41, 51">
</div>
</div>

<div class="row">
<div>
<label>⑤ 진한 글씨 횟수</label>
<select id="blackCount">
<option value="1" selected>1번</option><option value="2">2번</option><option value="3">3번</option>
</select>
</div>
<div>
<label>⑥ 회색 글씨 횟수</label>
<select id="grayCount">
<option value="0">0번</option><option value="1">1번</option><option value="2" selected>2번</option><option value="3">3번</option><option value="4">4번</option><option value="5">5번</option>
</select>
</div>
</div>

<div class="row">
<div>
<label>⑦ 빈칸 횟수</label>
<select id="blankCount">
<option value="1">1번</option><option value="2" selected>2번</option><option value="3">3번</option><option value="4">4번</option><option value="5">5번</option>
</select>
</div>
<div>
<label>⑧ 학습지 제목</label>
<input id="sheetTitle" placeholder="예: 한국어 기초 단어 1">
</div>
</div>

<div class="row">
<div><label>⑨ 멘토 이름</label><input id="mentor" placeholder="멘토 이름"></div>
<div><label>⑩ 멘티 이름</label><input id="mentee" placeholder="멘티 이름"></div>
</div>

<button type="button" id="makeBtn">⑪ 학습지 만들기</button>
<div id="status" class="status"></div>
</section>

<div id="editor"></div>

<section class="preview-wrap">
<div class="preview-head">
<h2>👀 미리보기</h2>
<button type="button" class="secondary" id="pdfBtn" onclick="saveAsPDF();return false;">PDF로 저장</button>
</div>
<div id="preview"><div class="help">학습지 만들기를 누르면 미리보기가 표시됩니다.</div></div>
</section>
</div>

let items=[];

function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]||m))}
function parseWords(){return document.getElementById('words').value.split(/[,\n]+/).map(x=>x.trim()).filter(Boolean)}
function parseCustomGroups(text){
 let groups=[],current=null;
 for(const raw of text.split(/\r?\n/)){
   const line=raw.trim(); if(!line)continue;
   const m=line.match(/^\[(.+?)\]$/);
   if(m){current={category:m[1].trim(),words:[]};groups.push(current)}
   else if(current){current.words.push(...line.split(',').map(x=>x.trim()).filter(Boolean))}
 }
 return groups;
}
function counts(){return{
 b:+document.getElementById('blackCount').value,
 g:+document.getElementById('grayCount').value,
 blank:+document.getElementById('blankCount').value
}}

function metricsFor(maxChars=0){
 const {b,g,blank}=counts(), rows=b+g+blank;
 let cardH=68, top=23, font=24;
 if(rows===6){cardH=76;top=21;font=23}
 else if(rows===7){cardH=84;top=21;font=22}
 else if(rows===8){cardH=92;top=20;font=21}
 else if(rows===9){cardH=100;top=20;font=20}
 else if(rows>=10){cardH=112;top=19;font=20}
 if(maxChars>=7){cardH+=4;top+=1;font=Math.max(font-1,18)}
 const rowH=(cardH-top)/rows;
 return {rows,cardH,top,rowH,font};
}

 document.getElementById('numberBlock').style.display=type==='number'?'block':'none';

 document.getElementById('words').disabled=type==='number';

}
function getNumberList(){
 const mode=document.getElementById('numberMode').value; let nums=[];
 if(mode==='range'){
   const s=+document.getElementById('numStart').value,e=+document.getElementById('numEnd').value;
   if(!Number.isInteger(s)||!Number.isInteger(e)||s<1||e>100||s>e){alert('숫자 범위는 1~100에서 입력해 주세요.');return null}
   for(let n=s;n<=e;n++)nums.push(n);
 }else{
   nums=document.getElementById('customNumbers').value.split(/[,\n]+/).map(x=>parseInt(x.trim(),10)).filter(n=>Number.isInteger(n)&&n>=1&&n<=100);
   nums=[...new Set(nums)]; if(!nums.length){alert('1~100 사이 숫자를 입력해 주세요.');return null}
 }
 return nums;
}

function writeRows(chars){
 const c=counts(); let out='';
 for(let i=0;i<c.b;i++)out+=writeRow(chars,'black');
 for(let i=0;i<c.g;i++)out+=writeRow(chars,'gray');
 for(let i=0;i<c.blank;i++)out+=writeRow(chars,'blank');
 return out;
}
function writeRow(chars,type){
 const m=metricsFor(chars.length);
 const content=chars.map(ch=>`<div class="cell"><span class="${type}" style="font-size:${m.font}px">${type==='blank'?'':esc(ch)}</span></div>`).join('');
 return `<div class="write-row" style="grid-template-columns:repeat(${chars.length},1fr);height:${m.rowH}mm;min-height:${m.rowH}mm">${content}</div>`;
}
function card(it){
 const chars=[...it.word], m=metricsFor(chars.length);
 return `<div class="card" style="height:${m.cardH}mm">
   <div class="card-top" style="height:${m.top}mm">
     ${it.image?`<img src="${it.image}">`:''}${it.meaning?`<div class="meaning">${esc(it.meaning)}</div>`:''}
   </div>
   <div class="writing">${writeRows(chars)}</div>
 </div>`;
}
function header(first,title,mentor,mentee){
 return first?`<div class="meta-title">${esc(title)}</div><div class="meta-line">${mentor?`멘토: ${esc(mentor)}`:''}${mentor&&mentee?'　|　':''}${mentee?`멘티: ${esc(mentee)}`:''}</div>`:'';
}


async function fillMissingTranslations(){
  const missing=items.map((it,i)=>({it,i})).filter(x=>!x.it.meaning);
  if(!missing.length) return;
  const status=document.getElementById('status');
  status.textContent=`베트남어 자동번역 중… (${missing.length}개)`;
  for(const {it,i} of missing){
    try{
      const q=encodeURIComponent(it.word);
      const res=await fetch(`https://api.mymemory.translated.net/get?q=${q}&langpair=ko|vi`);
      if(!res.ok) continue;
      const data=await res.json();
      const tr=(data && data.responseData && data.responseData.translatedText || '').trim();
      if(tr && !/MYMEMORY WARNING|PLEASE/i.test(tr)){
        it.meaning=tr;
        const el=document.getElementById(`meaning-${i}`);
        if(el) el.value=tr;
      }
    }catch(e){}
  }
  status.textContent='번역을 확인해 주세요. 필요하면 직접 수정할 수 있어요.';
}

function packWordPages(list, firstPage){
 const pages=[], gap=5;
 let page=[], used=0, isFirst=firstPage;
 const limit=()=>isFirst?226:270;
 function flush(){
   if(page.length){pages.push(page);page=[];used=0;isFirst=false;}
 }
 for(let i=0;i<list.length;){
   const a=list[i], aLen=[...(a.word||'')].length, aH=metricsFor(aLen).cardH;
   if(aLen>=7){
     if(used && used+gap+aH>limit())flush();
     page.push({items:[a],height:aH}); used+=(used?gap:0)+aH; i++; continue;
   }
   const b=list[i+1];
   if(b && [...(b.word||'')].length<7){
     const bH=metricsFor([...(b.word||'')].length).cardH;
     const rowH=Math.max(aH,bH);
     if(used && used+gap+rowH>limit())flush();
     page.push({items:[a,b],height:rowH}); used+=(used?gap:0)+rowH; i+=2;
   }else{
     if(used && used+gap+aH>limit())flush();
     page.push({items:[a],height:aH}); used+=(used?gap:0)+aH; i++;
   }
 }
 flush(); return pages;
}

function generateWordPreview(){
  try{
    const mode=document.getElementById('sortMode').value;

    items.forEach((it,i)=>{
      const m=document.getElementById('meaning-'+i);
      if(m) it.meaning=m.value.trim();
    });

    const groups={};
    if(mode==='auto' || mode==='custom'){
      items.forEach(it=>{
        const key=(it.category||'기타').trim()||'기타';
        (groups[key] ||= []).push(it);
      });
    }else{
      groups['전체']=items;
    }

    let out='', page=0;
    for(const [cat,list] of Object.entries(groups)){
      const packed=packWordPages(list, page===0);

      for(const rows of packed){
        page++;

        out += `<section class="print-page">
          ${header(page===1,
            document.getElementById('sheetTitle').value.trim()||'한국어 단어 쓰기',
            document.getElementById('mentor').value.trim(),
            document.getElementById('mentee').value.trim())}
          ${mode!=='none'?`<h2>${esc(cat)}</h2>`:''}
          <div class="packed-rows">`;

        for(const row of rows){
          const one=row.items.length===1;
          out += `<div class="packed-row ${one?'one':'two'}">
            ${row.items.map(card).join('')}
          </div>`;
        }

        out += `</div></section>`;
      }
    }

    if(!out) throw new Error('미리보기 내용이 없습니다.');

    document.getElementById('preview').innerHTML=out;
    document.getElementById('status').textContent=`단어 학습지 미리보기 완료 · ${page}페이지`;
    document.getElementById('preview').scrollIntoView({behavior:'smooth'});
  }catch(err){
    console.error(err);
    document.getElementById('status').textContent='미리보기 생성 중 오류가 발생했어요.';
  }
}

function sino(n){
 const d=['영','일','이','삼','사','오','육','칠','팔','구'];
 if(n<10)return d[n]; if(n===10)return'십'; if(n===100)return'백';
 const t=Math.floor(n/10),u=n%10; return (t===1?'':d[t])+'십'+(u?d[u]:'');
}
function native(n){
 const d=['','하나','둘','셋','넷','다섯','여섯','일곱','여덟','아홉'];
 const t=['','열','스물','서른','마흔','쉰','예순','일흔','여든','아흔'];
 if(n<=10)return d[n]; if(n<=19)return'열'+d[n-10]; if(n===100)return'—';
 const a=Math.floor(n/10),b=n%10,small={1:'하나',2:'둘',3:'셋',4:'넷',5:'다섯',6:'여섯',7:'일곱',8:'여덟',9:'아홉'};
 return t[a]+(b?small[b]:'');
}
function numCard(n,type){
 const c=counts(); let rows='';
 const labels=type==='sino'?[sino(n)]:type==='native'?[native(n)]:[sino(n),native(n)];
 function row(kind){
   if(labels.length===1)return `<div class="nrow one-col" style="height:10mm"><span class="${kind}">${kind==='blank'?'':esc(labels[0])}</span></div>`;
   return `<div class="nrow two-col" style="height:10mm"><span class="${kind}">${kind==='blank'?'':esc(labels[0])}</span><span class="${kind}">${kind==='blank'?'':esc(labels[1])}</span></div>`;
 }
 for(let i=0;i<c.b;i++)rows+=row('black'); for(let i=0;i<c.g;i++)rows+=row('gray'); for(let i=0;i<c.blank;i++)rows+=row('blank');
 return `<div class="ncard"><div class="number-only">${n}</div><div class="ngrid">${rows}</div></div>`;
}
function generateNumberPreview(){
 const nums=getNumberList();
 if(!nums)return;

 const type=document.getElementById('numberType').value;
 const c=counts();
 const rows=c.b+c.g+c.blank;

 // Number cards are intentionally compact and independent of word-card layout.
 // More writing rows -> fewer cards per page, but never distort the 2-column grid.
 let cap=8;
 if(rows<=5)cap=8;
 else if(rows<=7)cap=6;
 else if(rows<=9)cap=4;
 else cap=2;

 let out='',page=0;
 for(let i=0;i<nums.length;i+=cap){
   page++;
   const batch=nums.slice(i,i+cap);
   out+=`<section class="print-page">
     ${header(page===1,
       document.getElementById('sheetTitle').value.trim()||'숫자 쓰기',
       document.getElementById('mentor').value.trim(),
       document.getElementById('mentee').value.trim())}
     <h2>숫자 쓰기</h2>
     <div class="numgrid stable-numgrid">${batch.map(n=>numCard(n,type)).join('')}</div>
   </section>`;
 }
 document.getElementById('preview').innerHTML=out;
 document.getElementById('status').textContent=`숫자 학습지 미리보기 완료 · ${page}페이지`;
 document.getElementById('preview').scrollIntoView({behavior:'smooth'});
}

function saveAsPDF(){
  const preview=document.getElementById('preview');
  if(!preview || !preview.querySelector('.print-page')){
    alert('먼저 학습지 미리보기를 만들어 주세요.');
    return false;
  }
  // Give the browser one layout frame before printing so the last page's
  // dimensions are fully calculated; this avoids phantom trailing pages.
  requestAnimationFrame(()=>setTimeout(()=>window.print(),80));
  return false;
}

async function saveAsPDF(){
  const preview=document.getElementById('preview');
  const pages=[...preview.querySelectorAll('.print-page')];
  if(!pages.length){
    alert('먼저 학습지 미리보기를 만들어 주세요.');
    return false;
  }

  const btn=document.getElementById('pdfBtn');
  const old=btn.textContent;
  btn.disabled=true;
  btn.textContent='PDF 만드는 중…';

  try{
    const {jsPDF}=window.jspdf;
    const pdf=new jsPDF({orientation:'portrait',unit:'mm',format:'a4',compress:true});

    for(let i=0;i<pages.length;i++){
      const page=pages[i];

      // Render exactly the visible page. A fixed viewport width is used so the
      // PDF looks the same regardless of the phone/desktop viewport.
      const canvas=await html2canvas(page,{
        scale:2,
        useCORS:true,
        backgroundColor:'#ffffff',
        logging:false,
        width:794,
        windowWidth:794,
        scrollX:0,
        scrollY:0
      });

      if(i>0) pdf.addPage('a4','portrait');

      const img=canvas.toDataURL('image/jpeg',0.95);
      const pw=210;
      const ph=297;
      const ratio=Math.min(pw/canvas.width,ph/canvas.height);
      const w=canvas.width*ratio;
      const h=canvas.height*ratio;
      const x=(pw-w)/2;
      const y=(ph-h)/2;

      pdf.addImage(img,'JPEG',x,y,w,h,undefined,'FAST');
    }

    const title=(document.getElementById('sheetTitle').value.trim()||'한국어_멘토링_학습지')
      .replace(/[\\/:*?"<>|]/g,'_');
    pdf.save(title+'.pdf');
  }catch(err){
    console.error(err);
    alert('PDF를 만드는 중 문제가 생겼어요. 브라우저에서 인터넷 연결을 확인해 주세요.');
  }finally{
    btn.disabled=false;
    btn.textContent=old;
  }
  return false;
}

    const res=await fetch('/api/classify',{

    items=words.map((word,i)=>({

    console.error(e);
    status.textContent='AI 분류에 실패했어요. 서버가 실행 중인지 확인해 주세요.';
    alert(e.message);
  }finally{
    btn.disabled=false;
  }
});
